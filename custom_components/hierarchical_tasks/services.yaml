import_data:
  name: Import data
  description: Replace ALL lists with an exported document. Admin only. Export first.
  fields:
    document:
      name: Exported document
      description: Full document from Export/get_data. Replaces ALL lists. Admin only.
      required: true
      selector:
        object: {}
    expected_revision:
      name: Expected revision
      description: Optimistic concurrency check. Required for undo and import_data.
        Get the revision with get_data.
      required: true
      selector:
        number:
          min: 0
          max: 2147483647
          mode: box
undo:
  name: Undo
  description: Undo your own most recent change, only if no newer change exists. One
    step, lost on restart.
  fields:
    expected_revision:
      name: Expected revision
      description: Optimistic concurrency check. Required for undo and import_data.
        Get the revision with get_data.
      required: true
      selector:
        number:
          min: 0
          max: 2147483647
          mode: box
get_data:
  name: Get data
  description: Return the current revision and all lists. Requires response data.
